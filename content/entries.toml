# Every dated entry on the site: the homepage (frontend/index.html) and
# /cv/ are both rendered from this file by sitegen. Edit facts here only.
#
# Section `pages` lists where it appears ("home", "cv"); an entry may narrow
# that with its own `pages`. Within a section, entries are shown newest first.
# Dates are "YYYY-MM" or "YYYY"; a range uses `start` and `end` ("now" for
# ongoing). `refs` are the small lines under an entry; `link` is the linked
# part of a ref, `text` the plain part after it.

