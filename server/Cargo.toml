[package]
name = "server"
version = "0.1.0"
edition.workspace = true
rust-version = "1.85"
description = "Production server for the unwrap.rs security research portfolio"
repository.workspace = true
homepage.workspace = true
license.workspace = true
authors.workspace = true
readme = "../README.md"
publish = false
keywords = ["rust", "http", "web-server", "portfolio", "servant"]
categories = ["web-programming::http-server"]

[dependencies]
servant = { path = "../../servant-rs/servant" }
servant-server = { path = "../../servant-rs/servant-server" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs"] }
http = "1"
bytes = "1"
serde = { version = "1", features = ["derive"] }

[lints]
workspace = true
