[package]
name = "unwrap-rs"
version = "0.1.0"
edition.workspace = true
rust-version = "1.85"
description = "Personal website at unwrap.rs - Leptos + WASM + Tailwind"
repository.workspace = true
license.workspace = true
authors.workspace = true
keywords = ["wasm", "leptos", "website", "animation", "webassembly"]
categories = ["wasm", "web-programming"]

[dependencies]
leptos = { version = "0.7", features = ["csr"] }
rand = "0.9.0"
getrandom = { version = "0.3.2", features = ["wasm_js"] }
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Window", "Document", "VisibilityState"] }

[dev-dependencies]
wasm-bindgen-test = "0.3"

[lints]
workspace = true
