[package]
name = "unwrap-rs"
version = "0.1.0"
edition.workspace = true
rust-version = "1.88"
description = "Security engineering and research portfolio for Cole Leavitt"
repository.workspace = true
homepage.workspace = true
license.workspace = true
authors.workspace = true
readme = "../README.md"
publish = false
keywords = ["security", "rust", "leptos", "webassembly", "portfolio"]
categories = ["wasm", "web-programming"]

[dependencies]
leptos = { version = "0.9.0-rc1", features = ["csr"] }
rand = "0.10.3"
getrandom = { version = "0.4.3", features = ["wasm_js"] }
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Window", "Document", "VisibilityState", "MediaQueryList"] }

[dev-dependencies]
gloo-timers = "0.4"
wasm-bindgen-test = "0.3"

[lints]
workspace = true
