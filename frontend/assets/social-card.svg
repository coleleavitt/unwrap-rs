<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Source for frontend/social-card.png (1200x630). Same palette and type as the site. -->
  <style>
    @font-face {
      font-family: "JetBrains Mono";
      src: url("../fonts/JetBrainsMono-latin.woff2") format("woff2");
      font-weight: 100 800;
    }
    text { font-family: "JetBrains Mono", ui-monospace, monospace; }
  </style>
  <defs>
    <radialGradient id="glow" cx="50%" cy="0%" r="75%" gradientTransform="translate(0 0) scale(1 0.8)">
      <stop offset="0" stop-color="#200826"/>
      <stop offset="1" stop-color="#0d0a10"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="#0d0a10"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <text x="96" y="196" fill="#f0e8f4" font-size="76" font-weight="700" letter-spacing="-1.5">Cole Leavitt</text>
  <text x="96" y="256" fill="#a091a8" font-size="30">I build and break systems software in <tspan fill="#dd68ff">Rust</tspan>.</text>

  <text x="96" y="430" fill="#f0e8f4" font-size="68" font-weight="600">Result&lt;T, E&gt;<tspan fill="#dd68ff">.unwrap()</tspan></text>

  <text x="96" y="552" fill="#a091a8" font-size="26">unwrap.rs</text>
</svg>
