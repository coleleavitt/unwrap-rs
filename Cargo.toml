[package]
name = "unwrap-rs"
version = "0.1.0"
edition = "2021"
description = "Personal website at unwrap.rs - Leptos + WASM + Tailwind"
repository = "https://github.com/coleleavitt/unwrap-rs"
license = "MIT OR Apache-2.0"
authors = ["Cole Leavitt <coleleavitt@protonmail.com>"]

[dependencies]
leptos = { version = "0.7", features = ["csr"] }
rand = "0.9.0"
getrandom = { version = "0.3.2", features = ["wasm_js"] }
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Window"] }

[dev-dependencies]
wasm-bindgen-test = "0.3"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
opt-level = "z"
