[package]
name = "unwrap-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Personal website at unwrap.rs - Leptos + WASM + Tailwind"
repository = "https://github.com/coleleavitt/unwrap-rs"
license = "MIT OR Apache-2.0"
authors = ["Cole Leavitt <coleleavitt@protonmail.com>"]
keywords = ["wasm", "leptos", "website", "animation", "webassembly"]
categories = ["wasm", "web-programming"]

[dependencies]
leptos = { version = "0.7", features = ["csr"] }
rand = "0.9.3"
getrandom = { version = "0.3.2", features = ["wasm_js"] }
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Window", "Document", "VisibilityState"] }

[dev-dependencies]
wasm-bindgen-test = "0.3"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
opt-level = "z"
strip = true

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
# Precision loss is expected in animation floats
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
# vx/vy/vz, dx/dy naming is intentional and clear
similar_names = "allow"
# Multiple crate versions from transitive deps
multiple_crate_versions = "allow"
# Match arms for case-insensitive char mapping are intentional
match_same_arms = "allow"
# Wildcard imports for enum variants in match blocks
wildcard_imports = "allow"
enum_glob_use = "allow"
# Module inception (mod.rs with same name) is fine
module_name_repetitions = "allow"
# Component functions are necessarily large
too_many_lines = "allow"
