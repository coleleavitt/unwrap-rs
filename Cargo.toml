[package]
name = "unwrap-rs"
version = "0.1.0"
edition = "2021"

[dependencies]
gloo-timers = "0.3.0"
yew = { version = "0.21", features = ["csr"] }
rand = "0.9.0"
getrandom = { version = "0.3.2", features = ["wasm_js"] }

[dev-dependencies]
wasm-bindgen-test = "0.3"
gloo = { version = "0.10", features = ["futures"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
opt-level = "z"
