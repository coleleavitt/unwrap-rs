[workspace]
resolver = "2"
members = ["frontend", "server"]
# `cargo build`/`cargo test` at the root touch only the native server.
# The frontend is a wasm32 crate driven by Trunk (see frontend/Trunk.toml);
# building it for the host target fails on purpose (getrandom wasm_js backend).
default-members = ["server"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Cole Leavitt <coleleavitt@protonmail.com>"]
repository = "https://github.com/coleleavitt/unwrap-rs"

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
# Precision loss is expected in animation floats
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
# vx/vy/vz, dx/dy naming is intentional and clear
similar_names = "allow"
# Multiple crate versions from transitive deps
multiple_crate_versions = "allow"
# Match arms for case-insensitive char mapping are intentional
match_same_arms = "allow"
# Wildcard imports for enum variants in match blocks
wildcard_imports = "allow"
enum_glob_use = "allow"
# Module inception (mod.rs with same name) is fine
module_name_repetitions = "allow"
# Component / handler functions are necessarily large
too_many_lines = "allow"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
opt-level = "z"
strip = true
