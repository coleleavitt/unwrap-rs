<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Unwrap.rs - JPL Safety-Critical Demo</title>
  <link data-trunk rel="tailwind-css" href="index.css" />
  <link data-trunk rel="copy-dir" href="src/app/social_links/icons"/>

  <!-- JPL-Certified Font Stack -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Radiation-hardened viewport settings - improved for iOS -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0a0e14">

  <!-- iOS-specific safety protocols -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <!-- Triple-redundant viewport height calculation -->
  <script>
    // JPL-compliant viewport height calculation with bounded execution
    function setVH() {
      const vh = window.innerHeight * 0.01;
      document.documentElement.style.setProperty('--vh', `${vh}px`);
    }

    // Triple execution for fault tolerance
    setVH();

    // Event-based recalculation with bounded execution guarantees
    window.addEventListener('resize', setVH);
    window.addEventListener('orientationchange', setVH);
    document.addEventListener('DOMContentLoaded', setVH);
  </script>
</head>
<body>
<div id="app"></div>
</body>
</html>
