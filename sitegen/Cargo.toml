[package]
name = "sitegen"
version = "0.1.0"
edition.workspace = true
rust-version = "1.88"
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

# Build-time static page generator for /writing/. Not part of the shipped server.
[dependencies]
# rust-lang maintained CommonMark parser (same one rustdoc uses); build tool only
pulldown-cmark = { version = "0.13.6", default-features = false, features = ["html"] }
# Sibling checkout: renders ```mermaid fences to inline SVG at build time
mmd-svg = { path = "../../mmd-svg" }
# Build-time syntax highlighting (Sublime grammars, as used by bat and zola);
# fancy-regex keeps it pure Rust. Output is classed spans, styled in index.css.
# yaml-load reads the vendored syntaxes/Rust.sublime-syntax.
# ```xtensa-demo fences: the listing is rendered at build time with the
# same decoder the page then runs as WebAssembly
xtensa-dis = { path = "../xtensa-dis" }
# content/entries.toml: the homepage and CV entries (build time only)
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.2.1"
syntect = { version = "5.3.0", default-features = false, features = ["default-syntaxes", "html", "regex-fancy", "yaml-load"] }

[lints]
workspace = true
